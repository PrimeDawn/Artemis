      - 配对、信任、发现、审批、断开、忘记与控制页操作行为不变；手机端 UI 与连接状态提示不退化。
      - android/ 目录零改动；JVM 单元测试 18 项（17 通过 + 1 跳过）通过；APK 可构建。
      - receiver 测试保留配对/信任/发现用例通过，删除的接收端用例逐条给出理由。
      - 产品文档与协议文档口径同步为系统摄像头/麦克风方向。
    next_action: 已完成并原位归档；后续 Spec 可直接以本 Spec 的配对/信任基线为前置。
    summary: 已交付并归档：接收端页面/票据/信令通道移除，配对与连接状态不退化，android 零改动；45 项 Node、18 项 JVM、集成 trust/reconnect/limits 与模拟器/真机端到端全部通过。
