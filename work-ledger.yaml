      - spec/versions/v0.1/version-context.md
      - spec/versions/v0.1/plan.html

  - id: SPEC-offline-pairing
    kind: tech
    title: 离线配对与信令信任
    status: planned
    goal: "goal#artemis-v0.1"
    milestone: VERSION-v0.1
    priority: P0
    required: true
    depends_on:
      - SPEC-sdk-toolchain
    acceptance:
      - 断公网保留局域网时可完成配对和信令，不依赖公网信令、STUN、TURN或CDN。
      - 验证配对有效期、撤销和未配对请求拒绝，知道IP本身不能取得媒体接收权限。
      - 保留TLS证书信任、二维码绑定或替代信任方案的实测取舍及操作步骤。
    next_action: 工具链验证完成后，通过spec-start建立离线配对与信令信任Spec。
    summary: v0.1技术预研规划项，尚未启动Spec或业务实现。
    tags: [v0.1, tech, m0]
    paths:
      - spec/versions/v0.1/version-context.md
      - spec/versions/v0.1/plan.html

  - id: SPEC-media-obs
    kind: tech
    title: 手机到 OBS 的最小音视频链路
    status: planned
    goal: "goal#artemis-v0.1"
    milestone: VERSION-v0.1
    priority: P0
    required: true
    depends_on:
      - SPEC-sdk-toolchain
      - SPEC-offline-pairing
    acceptance:
      - S24与指定Windows和OBS环境中同时接收摄像头画面及内置麦克风，录制可回看音视频。
      - 以720p/30fps为基线记录实际编码、分辨率和帧率，Node.js不转码或逐帧中转。
      - 单活动接收端下可停止采集并释放相机、麦克风和连接，再次启动有效。
    next_action: 前置Spec完成后，通过spec-start设计并验证最小音视频链路。
    summary: v0.1技术预研规划项，尚未启动Spec或业务实现。
    tags: [v0.1, tech, m0]
    paths:
      - spec/versions/v0.1/version-context.md
      - spec/versions/v0.1/plan.html

  - id: SPEC-validation-baseline
    kind: tech
    title: 真机验证基线与复现交付
    status: planned
    goal: "goal#artemis-v0.1"
    milestone: VERSION-v0.1
    priority: P1
    required: true
    depends_on:
      - SPEC-media-obs
    acceptance:
      - 固定并记录设备和软件环境，断公网完成配对至OBS音视频接收的端到端复测。
      - 连续推流至少10分钟并重复启停至少3次，保留结果及异常记录。
      - 实测延迟与音画偏差并对照300ms和150ms产品目标，超标项明确处置，不记为达标。
      - 提供可复现实验APK、PC启动步骤、依赖许可证和研究结论；不替代全部一期验收。
    next_action: 链路Spec完成后，通过spec-start制定真机验证和实验原型交付方案。
    summary: v0.1技术预研规划项，尚未启动Spec或业务实现。
    tags: [v0.1, tech, m0]
    paths:
      - spec/versions/v0.1/version-context.md
      - spec/versions/v0.1/plan.html

