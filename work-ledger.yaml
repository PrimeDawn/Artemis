  - id: SPEC-offline-pairing
    kind: tech
    title: 离线配对与信令信任
    status: completed
    goal: "goal#artemis-v0.1"
    milestone: VERSION-v0.1
    priority: P0
    required: true
    depends_on:
      - SPEC-sdk-toolchain
    acceptance:
      - 保留无需公网的配对和信令能力；本轮保持公网连接验证局域网配对与信令，检查无公网信令、STUN、TURN或CDN依赖；实际断公网运行记未实测，不作为本轮验收阻断。
      - 验证首次确认、短期认证挑战/票据时效、撤销和未授权请求拒绝；设备信任及活动连接不设固定期限，知道IP本身不能取得媒体接收权限。
      - 保留TLS证书信任、二维码绑定或替代信任方案的实测取舍及操作步骤。
      - 自动发现已打开App的手机并由电脑单击选择，首次手机确认一次、后续重开或服务重启免配对；持久记住身份。
      - 活动连接与设备信任不设固定到期或空闲期限，故障自动恢复已选设备；主动断开或取消信任后停止重连。
      - App仅在前台且未锁屏时使用并请求保持常亮；切其他App或锁屏暂停连接与重试，返回App自动恢复原被选且受信的电脑；主动断开或取消信任仍保持停止。
    next_action: "已原位归档并创建PR #3至dev，等待审阅/用户合并；后续Spec保持原计划。"
    summary: "自动发现、持久信任、授权信令和前台连接恢复已交付；Node43/JVM18/集成44通过，S24同服务连续锁屏解锁通过。AWR验收completed，PR https://github.com/PrimeDawn/Artemis/pull/3 未合并。真实手机换IP未测，实际断公网排除，媒体属于后续Spec。"
    tags: [v0.1, tech, m0]
    paths:
      - spec/versions/v0.1/specs/20261029-0934-tech-离线配对与信令信任/explorer/exploration-report.html
      - spec/versions/v0.1/specs/20261029-0934-tech-离线配对与信令信任/writer/plan.html
