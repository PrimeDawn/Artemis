      - 手机麦克风音频经独立通道传到 PC，并输出到软件探测到的用户自备虚拟声卡渲染端；其采集端可收到该声音。
      - 未安装受支持虚拟声卡时视频照常、音频不可用并明确提示原因；不自研内核驱动、不涉及签名。
      - 其他软件兼容性不在范围内。
    next_action: 按 writer/plan.html 实现独立 /audio 通道、手机端 Opus/AAC 采集编码、PC 端解码与端点探测输出。
