work_items:
  - id: ARTEMIS-INTAKE-001
    kind: intake
    title: 完成工作流接入后规划 Artemis 首个技术预研版本
    status: completed
    goal: "goal#artemis-v1"
    priority: P0
    required: true
    depends_on: []
    acceptance:
      - 以产品规划.md确认一期目标、边界和验收目标，区分计划与实测结果。
      - 通过version-start规划首个版本，并将M0技术预研拆分为有明确验收标准的Spec。
      - 记录WebRTC SDK、OBS接收、局域网离线直连和配对信任方案的待验证项。
    next_action: 通过spec-start启动SPEC-sdk-toolchain，先完成需求对齐、探索及实现与测试计划确认。
    summary: v0.1版本计划、4个Spec及依赖已建立，用户已确认本版规划；尚未启动业务Spec。
    "evidence": ["spec/versions/v0.1/artifacts/plan-validation.json"]
    "verification": {"evidence_level":"locally_verified"}

  - id: SPEC-sdk-toolchain
    kind: tech
    title: SDK 与工具链可行性
    status: planned
    goal: "goal#artemis-v0.1"
    milestone: VERSION-v0.1
    priority: P0
    required: true
    depends_on: []
    acceptance:
      - 记录可核验的WebRTC SDK来源、版本、许可证、ABI和Android版本兼容结论。
      - 按文档可重复构建最小APK并启动PC实验服务，保留命令、环境和结果。
      - 核验Android原生库页面大小要求，明确未完成的真机验证和阻断。
    next_action: 通过spec-start建立SDK与工具链Spec，完成探索、设计和测试计划确认。
    summary: v0.1技术预研规划项，尚未启动Spec或业务实现。
    tags: [v0.1, tech, m0]
